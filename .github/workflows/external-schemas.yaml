name: External Schemas

on:
  pull_request:
    branches:
      - master
    paths:
      - 'external-schemas/**'
      - '.github/workflows/external-schemas.yaml'
  push:
    branches:
      - master
    paths:
      - 'external-schemas/**'
      - '.github/workflows/external-schemas.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  avro-compile:
    name: Compile Avro demo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: external-schemas/java-demos/avro
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: external-schemas/java-demos/avro/pom.xml

      - name: Compile external schema demo
        run: mvn --batch-mode --no-transfer-progress clean compile
